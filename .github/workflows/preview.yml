name: Build isolated preview
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build -- --base=./
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-cloud-isolated-preview
          path: dist/
          retention-days: 7
